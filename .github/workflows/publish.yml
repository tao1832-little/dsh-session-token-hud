name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing or empty"
            exit 1
          fi
          echo "NPM_TOKEN present, length ${#NODE_AUTH_TOKEN}"

      - name: Show version being published
        run: node -p "require('./package.json').name + '@' + require('./package.json').version"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          npm publish --access public > publish.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            msg=$(grep -i -m1 'npm ERR' publish.log | tr '\n' ' ' | head -c 400)
            echo "::error::publish failed (exit $status): $msg"
            echo '--- full log ---'
            cat publish.log
            exit "$status"
          fi
          echo "published OK"