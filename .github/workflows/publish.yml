name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          who=$(npm whoami 2>&1 | head -c 60)
          echo "npm whoami: $who"
          echo "registry: $(npm config get registry)"
          npm publish --access public > publish.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            msg=$(tr '\n' ' ' < publish.log | head -c 1200)
            echo "::error::whoami=[$who] $msg"
            cat publish.log
            exit "$status"
          fi
          echo "published OK"